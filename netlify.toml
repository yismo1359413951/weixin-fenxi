[[redirects]]
  from = "/api/analyze"
  to = "https://personalens-api.personalens-yiyi.workers.dev"
  status = 200
  force = true

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# analyze：千问 VL（逐张）+ DeepSeek，适当延长避免超时（具体上限随套餐而定）
[functions.analyze]
  timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
